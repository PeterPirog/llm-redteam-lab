name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest

  ollama-probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime/ollama_probe
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: runtime/ollama_probe/go.mod
          cache-dependency-path: runtime/ollama_probe/go.mod
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test -race ./...
      - name: Reproducible probe build
        run: |
          CGO_ENABLED=0 go build \
            -mod=readonly \
            -trimpath \
            -buildvcs=false \
            -ldflags="-s -w -buildid=" \
            -o "$RUNNER_TEMP/rt-ollama-probe" \
            .
          CGO_ENABLED=0 go build \
            -mod=readonly \
            -trimpath \
            -buildvcs=false \
            -ldflags="-s -w -buildid=" \
            -o "$RUNNER_TEMP/rt-opencode-probe" \
            ./cmd/opencode-probe

  no-external-inference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify CI has no configured model credentials
        shell: bash
        run: |
          test -z "${OPENAI_API_KEY:-}"
          test -z "${ANTHROPIC_API_KEY:-}"
          test -z "${OPENWEBUI_API_KEY:-}"
