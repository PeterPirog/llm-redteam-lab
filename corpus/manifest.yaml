version: 9
corpus_id: llm-redteam-lab-corpus-v1
last_verified: 2026-09-11

authoritative_files:
  sources:
    - sources.yaml
    - sources-2026-supplement.yaml
  techniques:
    - techniques.yaml
    - techniques-2026-supplement.yaml
  tiers: tiers.yaml
  observed_difficulty: scoring/observed-difficulty.yaml
  case_schema: schema/attack-case.schema.json
  external_policy: external/README.md
  importer_catalog: importers/catalog.yaml
  external_taxonomies: taxonomy/external-taxonomies.yaml
  mlcommons_crosswalk: taxonomy/mlcommons-v0.7-crosswalk.yaml
  source_snapshot: source-snapshots/2026-09-08.yaml
  coverage: COVERAGE.md

native_case_sets:
  - native/smoke/canary-baseline.yaml
  - native/baseline/inert-techniques-v1.yaml
  - native/multiturn/reference-discovery-v1.yaml
  - native/multiturn/synthetic-sequences-v1.yaml
  - native/agent/adaptive-system-boundaries-v1.yaml
  - native/agent/fixture-adaptive-injection-v1.yaml
  - native/rag/reference-discovery-v1.yaml

native_fixtures:
  - fixtures/coding/repo_injection_canary/fixture.yaml
  - fixtures/coding/terminal_output_marker/fixture.yaml
  - fixtures/rag/context_poison_canary/corpus.yaml

packs:
  - packs/smoke-v1.yaml
  - packs/baseline-v1.yaml
  - packs/comprehensive-v1.yaml
  - packs/2026-extensions.yaml

default_first_run_pack: packs/smoke-v1.yaml

architecture_decision:
  - ../docs/adr/ADR-006-attack-corpus-registry.md

principles:
  immutable_case_definitions: true
  results_stored_separately: true
  local_first: true
  deterministic_first: true
  gated_sources_require_opt_in: true
  real_service_sources_disabled_by_default: true
  synthetic_canaries_only_for_native_secret_tests: true
  target_specific_difficulty_is_empirical: true
  external_datasets_are_not_implicitly_vendored: true
  benign_controls_are_mandatory_for_safety_claims: true
  mechanism_taxonomy_is_separate_from_attack_complexity: true
  environment_fixtures_are_separate_attack_inputs: true
  retrieval_corpora_are_security_significant_target_dependencies: true

supported_target_classes:
  - coding
  - reasoning
  - writing
  - image_generation

supported_target_modes:
  - MODEL
  - PIPELINE
  - AGENT

validation_requirements:
  - every imported case validates against attack-case.schema.json after normalization
  - every imported record retains source name and upstream record identifier when available
  - every imported artifact records upstream revision or retrieval timestamp
  - gated data is never mirrored automatically
  - a source license must not be inferred from an aggregator when records retain upstream licenses
  - native dangerous effects are replaced with synthetic canaries or inert workspace-local markers
  - safety scores must include benign/overrefusal controls where applicable
  - native and imported case IDs are globally unique
  - a concrete prompt-only case maps to at most one MLCommons v0.7 leaf when within that taxonomy scope
  - environment-originated attacks preserve fixture origin, bundle fingerprint and per-trial isolation identity
  - RAG targets preserve corpus identity and ordered retrieval provenance for every evaluated interaction
