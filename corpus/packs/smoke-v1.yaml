version: 1
id: smoke-v1
status: default_first_run
purpose: >-
  Prove target connectivity, canary setup, evidence collection and deterministic
  grading before any Red-model inference or external dataset download occurs.

constraints:
  red_model_calls: 0
  external_dataset_downloads: 0
  network_required: false
  cloud_required: false
  synthetic_canaries_only: true
  stop_on_infrastructure_error: true

packs:
  writing:
    target_class: writing
    target_modes: [MODEL, PIPELINE]
    cases:
      - NATIVE-T0-WR-001
      - NATIVE-T1-WR-001
      - NATIVE-T1-WR-002
      - NATIVE-T1-WR-003
      - NATIVE-T2-WR-001
      - NATIVE-T2-FIC-001
      - NATIVE-T2-AUTH-001
      - NATIVE-T2-B64-001
    expected_max_target_calls: 8

  reasoning:
    target_class: reasoning
    target_modes: [MODEL, PIPELINE]
    cases:
      - NATIVE-T0-WR-001
      - NATIVE-T1-WR-001
      - NATIVE-T1-WR-002
      - NATIVE-T1-WR-003
      - NATIVE-T2-WR-001
      - NATIVE-T2-FIC-001
      - NATIVE-T2-AUTH-001
      - NATIVE-T2-CCA-001
    expected_max_target_calls: 9
    note: NATIVE-T2-CCA-001 is a two-turn case.

  coding_model_only:
    target_class: coding
    target_modes: [MODEL, PIPELINE]
    cases:
      - NATIVE-T2-AUTH-001
    expected_max_target_calls: 1
    note: Full coding security requires AGENT mode and cannot be inferred from chat-only output.

  coding_agent:
    target_class: coding
    target_modes: [AGENT]
    enabled_by_default: false
    requirements:
      - disposable_workspace
      - shell_and_file_trace
      - deny_external_network
    cases:
      - NATIVE-T4-CODE-001
      - NATIVE-T4-CODE-002
    expected_max_agent_runs: 2

  image_generation:
    target_class: image_generation
    target_modes: [MODEL, PIPELINE]
    enabled_by_default: false
    requirements:
      - multimodal_judge_or_specialized_visual_detector
      - artifact_storage
    cases:
      - NATIVE-T0-IMG-CTRL-001
      - NATIVE-T1-IMG-SMOKE-001
    expected_max_image_generations: 2

success_criteria:
  harness:
    - all enabled target requests produce normalized evidence or explicit infrastructure errors
    - canary detectors are operational
    - benign controls are not misclassified as compromise
    - no adaptive attacker is invoked
  security_claims:
    - smoke results are diagnostic only
    - passing smoke does not imply jailbreak resistance
    - failing a canary case may create a preliminary finding but requires configured reproduction before confirmation
