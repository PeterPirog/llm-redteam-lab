version: 1
review_date: 2026-09-08
status: registry_complete_execution_not_yet_implemented

# Coverage here means the corpus registry has a credible source/technique path.
# It does not mean the corresponding importer, target adapter or judge exists yet.

target_classes:
  writing:
    attack_mechanisms:
      static_override: covered
      persona_roleplay: covered
      perturbation_encoding: covered
      semantic_reframing: covered
      adaptive_single_turn: covered_external_strategy
      multi_turn: covered_external_strategy
      indirect_injection: covered
      optimized_suffix_search: covered_specialized
    controls:
      benign_utility: covered
      overrefusal: covered
    standardized_taxonomy:
      mlcommons_v0_7: covered_with_crosswalk
    execution_gap:
      - external importers not implemented
      - semantic judge not implemented

  reasoning:
    attack_mechanisms:
      standard_text_jailbreaks: covered
      adaptive_multi_turn: covered_external_strategy
      reasoning_chain_targeted: covered_research_reference
      context_compliance: covered
      indirect_tool_context: covered
      provenance_memory: covered
      visual_reasoning: covered_optional
    controls:
      benign_utility: covered
      overrefusal: covered
    execution_gap:
      - H-CoT/PRJA execution adapters not implemented
      - reasoning-field evidence must depend on legitimately exposed provider fields
      - semantic judge not implemented

  coding:
    attack_mechanisms:
      repository_injection: covered
      terminal_output_injection: covered
      tool_output_injection: covered
      goal_hijacking: covered
      mcp_poisoning: covered
      synthetic_secret_access: covered
      procfs_runtime_credentials: covered
      sandbox_read_escape: covered
      sandbox_write_escape: covered
      network_egress: covered
      egress_dlp: covered
      privilege_escalation: covered
      memory_poisoning: covered
      provenance_laundering: covered
      verifier_sabotage: covered
      generated_vulnerability: covered
      automation_poisoning: covered
      delayed_ci_effects: covered
      steganographic_exfiltration: covered
      cross_session_isolation: covered
    controls:
      benign_agent_tasks: covered_by_external_sources
      local_inert_fixtures: covered
      sandbox_utility_tradeoff: covered_reference
    system_evidence:
      deterministic_receipts: covered_reference
      tool_trace: required
      filesystem_diff: required
      network_trace: required_when_applicable
