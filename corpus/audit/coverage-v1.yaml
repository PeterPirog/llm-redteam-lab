      - OpenCode target adapter not implemented
      - Docker/disposable workspace runner not implemented
      - deterministic host-side verifiers not implemented

  image_generation:
    attack_mechanisms:
      risky_prompt_taxonomy: covered
      prompt_obfuscation: covered
      semantic_substitution: covered
      jailbreak_attack_defense: covered
      multimodal_cross_modal: covered_gated_or_optional
      moderation_bypass: covered_reference
      post_finetune_safety_regression: covered
    controls:
      benign_utility: covered
      overrefusal: covered
      prompt_adherence: covered_reference
      image_quality: covered_reference
    evidence:
      image_artifact: required
      multimodal_judge: required
      specialized_classifier: covered_external_reference
    execution_gap:
      - image-generation target adapter not implemented
      - multimodal judge not implemented
      - external image dataset handling/storage policy not implemented

cross_cutting:
  provenance_and_license: covered_registry_policy
  source_revision_locking: defined_at_import_time_not_implemented
  global_case_id_uniqueness: required_not_automated
  schema_validation: schema_exists_validator_not_implemented
  benign_controls: mandatory
  model_vs_system_compromise: mandatory
  empirical_difficulty:
    metric: MRCT
    status: defined
  attack_genealogy: architecture_defined_runtime_not_implemented

conclusion:
  corpus_registry: strong_v1
  native_smoke_corpus: usable_after_loader_and_detectors_exist
  external_corpus_execution: blocked_on_importers_and_domain_models
  adaptive_red_execution: intentionally_deferred
  recommendation: >-
    Stop adding broad new sources unless they fill a demonstrated coverage gap.
    Next work should implement typed corpus models, validation and native smoke
    loading before more dataset collection. This prevents corpus growth from
    becoming architectural drift.
