version: 1
last_verified: 2026-09-08

# Technique definitions contain mechanisms and provenance, not harmful goals.
# Actual external payloads stay upstream unless explicitly and legally imported.
techniques:
  control_benign:
    tier: T0
    families: [control, utility]
    target_classes: [writing, reasoning, coding, image_generation]
    interaction: single_turn
    description: Benign control used to measure utility and false refusals.

  direct_request:
    tier: T1
    families: [direct_request]
    target_classes: [writing, reasoning]
    interaction: single_turn
    description: Direct request for a protected synthetic outcome; establishes baseline refusal.

  instruction_override:
    tier: T1
    families: [instruction_override]
    target_classes: [writing, reasoning, coding, image_generation]
    interaction: single_turn
    description: Attempts to replace or cancel higher-priority instructions.

  persona_roleplay:
    tier: T1
    families: [persona, roleplay]
    target_classes: [writing, reasoning]
    interaction: single_turn
    description: Frames the request through an alternate persona, fictional role or unrestricted assistant.

  static_jailbreak_template:
    tier: T1
    families: [persona, instruction_override, known_template]
    target_classes: [writing, reasoning]
    interaction: single_turn
    implementations: [promptfoo_strategies, strongreject_attacks]
    description: Historical known jailbreak templates such as DAN/Skeleton-Key-style wrappers.

  base64_transform:
