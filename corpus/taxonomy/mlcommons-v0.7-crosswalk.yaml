# MLCommons v0.7 is mechanism-first and requires one concrete attack instance
# to map to one leaf. Project technique definitions can be broader, therefore
# candidate_leaves must be resolved from the instantiated case at normalization
# time. T0-T5 remains an independent execution-complexity/cost axis.

