version: 1

# Zero-cloud default for preliminary HAL runs.
# Run the harness on HAL or adjust the endpoint to HAL's trusted LAN address.
# Do not replace these IDs with :cloud/-cloud aliases: inventory admission will reject
# any record carrying Ollama remote_model or remote_host metadata.
policy:
  local_first: true
  allow_cloud_fallback: false

roles:
  # Strong local planner with tools/thinking and long context; already observed loaded
  # in the supplied HAL inventory.
  red_planner:
    provider: ollama
    model: nemotron-3.5-lightning:latest
    class: local
    endpoint: http://127.0.0.1:11434/v1/chat/completions
    capabilities: [text, reasoning]
    temperature: 0.7
    max_output_tokens: 1200
    context_tokens: 1048576
    enabled: true
    fallback: []

  # Different model family from the planner to reduce correlated Red failures.
  red_mutator:
    provider: ollama
    model: gpt-oss:latest
    class: local
    endpoint: http://127.0.0.1:11434/v1/chat/completions
    capabilities: [text, reasoning]
    temperature: 0.9
    max_output_tokens: 700
    context_tokens: 131072
    enabled: true
    fallback: []

  # Disabled during deterministic smoke runs. Enable only when a semantic Judge is
  # explicitly required after deterministic detectors are inconclusive.
  judge_semantic:
    provider: ollama
    model: gemma4:31b
    class: local
    endpoint: http://127.0.0.1:11434/v1/chat/completions
    capabilities: [text, reasoning]
    temperature: 0.0
    max_output_tokens: 700
    enabled: false
    invoke: only_if_deterministic_inconclusive
    fallback: []

  # Independent multimodal family for later image/visual evidence adjudication.
  judge_multimodal:
    provider: ollama
    model: muse-glimmer:latest
    class: local
    endpoint: http://127.0.0.1:11434/v1/chat/completions
    capabilities: [text, reasoning, vision]
    temperature: 0.0
    max_output_tokens: 800
    context_tokens: 131072
    enabled: false
    invoke: only_if_visual_evidence_requires_semantics
    fallback: []

  # Kept disabled for smoke to avoid unnecessary model loading.
  forensic:
    provider: ollama
    model: qwen3.6:latest
    class: local
    endpoint: http://127.0.0.1:11434/v1/chat/completions
    capabilities: [text, reasoning, vision]
    temperature: 0.1
    max_output_tokens: 1500
    context_tokens: 262144
    enabled: false
    invoke: reproducible_findings_only
    fallback: []

# Keep the attacker ensemble disabled for the first instrumentation smoke. The single
# planner+mutator pair gives a simpler baseline and avoids loading extra models at once.
red_attacker_pool:
  enabled: false
  variants: []

# Reference MODEL runs choose Blue explicitly at campaign invocation.
# Recommended initial Blue target: qwen3.8:latest (local Qwen family, distinct from Red
# planner/mutator and from the optional Gemma Judge).
blue:
  source: campaign
