version: 1

# Lightweight zero-cloud profile for instrumentation smoke on HAL.
# This profile favors runtime simplicity over maximum attack quality. A stronger local
# quality profile remains available in models.hal-local.example.yaml.
policy:
  local_first: true
  allow_cloud_fallback: false

roles:
  # Smallest supplied local model with explicit thinking capability that is suitable for
  # adaptive planning without using a cloud proxy.
  red_planner:
    provider: ollama
    model: gpt-oss:latest
    class: local
    endpoint: http://127.0.0.1:11434/v1/chat/completions
    capabilities: [text, reasoning]
    temperature: 0.7
    max_output_tokens: 900
    context_tokens: 131072
    enabled: true
    fallback: []

  # Compact, independent family for inexpensive prompt mutation.
  red_mutator:
    provider: ollama
    model: mistral:7b-instruct
    class: local
    endpoint: http://127.0.0.1:11434/v1/chat/completions
    capabilities: [text]
    temperature: 0.9
    max_output_tokens: 500
    context_tokens: 32768
    enabled: true
    fallback: []

  # Semantic model judges stay disabled in instrumentation smoke. The fixed reference
  # experiment uses its deterministic canary Judge instead.
  judge_semantic:
    provider: ollama
    model: gemma4:31b
    class: local
    endpoint: http://127.0.0.1:11434/v1/chat/completions
    capabilities: [text, reasoning]
    temperature: 0.0
    max_output_tokens: 700
    enabled: false
    invoke: only_if_deterministic_inconclusive
    fallback: []

  judge_multimodal:
    provider: ollama
    model: muse-glimmer:latest
    class: local
    endpoint: http://127.0.0.1:11434/v1/chat/completions
    capabilities: [text, reasoning, vision]
    temperature: 0.0
    max_output_tokens: 800
    context_tokens: 131072
    enabled: false
    invoke: only_if_visual_evidence_requires_semantics
    fallback: []

  forensic:
    provider: ollama
    model: qwen3.6:latest
    class: local
    endpoint: http://127.0.0.1:11434/v1/chat/completions
    capabilities: [text, reasoning, vision]
    temperature: 0.1
    max_output_tokens: 1200
    context_tokens: 262144
    enabled: false
    invoke: reproducible_findings_only
    fallback: []

red_attacker_pool:
  enabled: false
  variants: []

# Recommended smoke Blue target: ornith-1.5:9b. It is a local 9B Qwen-family model and
# keeps the first E2E validation materially lighter than qwen3.8:latest. Use qwen3.8 for
# the stronger local quality profile after instrumentation is proven.
blue:
  source: campaign
